<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Sign up — Alislamiah Tube</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
:root{--bg:#07111f;--panel:#0e1b2d;--border:#20344c;--blue:#3979f6;--text:#f4f7ff;--muted:#9aabc2}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#142b49 0%,#07111f 58%);font-family:Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.container{width:100%;max-width:420px}
.language{display:flex;justify-content:flex-end;margin-bottom:14px}
select{background:#101e31;color:white;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
.card{background:rgba(14,27,45,.96);border:1px solid var(--border);border-radius:23px;padding:30px 25px;box-shadow:0 22px 70px #0005}
.brand{text-align:center;margin-bottom:27px}
.brand img{width:76px;height:76px;object-fit:contain;border-radius:18px}
.brand h1{font-size:25px;margin:14px 0 7px}
.brand p{font-size:14px;color:var(--muted);margin:0}
label{display:block;font-size:13px;color:#dce6f5;margin:18px 0 8px}
input{width:100%;padding:14px 13px;background:#081321;border:1px solid var(--border);border-radius:11px;color:white;font-size:15px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3979f622}
.password-wrap{position:relative}
.password-wrap input{padding-inline-end:66px}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#9db9ee;cursor:pointer}
[dir="rtl"] .show{right:auto;left:10px}
button.primary{width:100%;border:0;border-radius:11px;padding:14px;background:linear-gradient(100deg,#3979f6,#2458d7);color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:24px}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;padding:11px;border-radius:10px;margin-top:14px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.message.error{display:block;background:#4a1d29;color:#ffc5ce}
.message.success{display:block;background:#123c31;color:#b8f7d9}
.bottom{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
a{color:#83adff;text-decoration:none;font-size:13px}
a:hover{text-decoration:underline}
.support{text-align:center;margin-top:21px}
.support a{display:inline-block;padding:10px 14px;border:1px solid var(--border);border-radius:10px}
.footer{text-align:center;color:#657993;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <div class="language">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
    </select>
  </div>  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="Alislamiah Tube" onerror="this.style.display='none'">
      <h1>Alislamiah Tube</h1>
      <p data-i="subtitle">Create your account</p>
    </div><form id="signupForm">
  <label for="email" data-i="emailLabel">Email address</label>
  <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

  <label for="password" data-i="passwordLabel">Password</label>
  <div class="password-wrap">
    <input id="password" type="password" autocomplete="new-password" minlength="6" required>
    <button type="button" class="show" id="showPassword" data-i="show">Show</button>
  </div>

  <label for="confirmPassword" data-i="confirmLabel">Confirm password</label>
  <div class="password-wrap">
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
    <button type="button" class="show" id="showConfirm" data-i="show">Show</button>
  </div>

  <button class="primary" id="signupButton" type="submit" data-i="signup">Create account</button>
  <div id="message" class="message" role="status"></div>
</form>

<div class="bottom">
  <span data-i="haveAccount">Already have an account?</span>
  <a href="signin.html" data-i="signin">Sign in</a>
</div>

<div class="support">
  <a href="https://wa.me/213777543015" target="_blank" rel="noopener noreferrer" data-i="support">Contact administration</a>
</div>

  </main>
  <div class="footer">© Alislamiah Tube</div>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6Xn8I6pGBQjEuaFflKCxmQezpHP9D9D9Kk",
  authDomain: "alislamiah-tube.firebaseapp.com",
  projectId: "alislamiah-tube",
  storageBucket: "alislamiah-tube.firebasestorage.app",
  messagingSenderId: "63719640725",
  appId: "1:63719640725:web:62b71660a6c9da8d55959c",
  measurementId: "G-Q9B70NKKCJ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const translations={
  en:{
    subtitle:"Create your account",emailLabel:"Email address",
    passwordLabel:"Password",confirmLabel:"Confirm password",
    show:"Show",hide:"Hide",signup:"Create account",
    haveAccount:"Already have an account?",signin:"Sign in",
    support:"Contact administration",mismatch:"Passwords do not match.",
    "auth/email-already-in-use":"This email is already registered. Please sign in.",
    "auth/invalid-email":"Enter a valid email address.",
    "auth/weak-password":"Choose a stronger password with at least 6 characters.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    generic:"Account creation failed. Please try again."
  },
  ar:{
    subtitle:"أنشئ حسابك",emailLabel:"البريد الإلكتروني",
    passwordLabel:"كلمة المرور",confirmLabel:"تأكيد كلمة المرور",
    show:"إظهار",hide:"إخفاء",signup:"إنشاء حساب",
    haveAccount:"لديك حساب بالفعل؟",signin:"تسجيل الدخول",
    support:"تواصل مع الإدارة",mismatch:"كلمتا المرور غير متطابقتين.",
    "auth/email-already-in-use":"هذا البريد مسجل بالفعل. سجّل الدخول.",
    "auth/invalid-email":"أدخل بريدًا إلكترونيًا صحيحًا.",
    "auth/weak-password":"اختر كلمة مرور أقوى، من 6 أحرف على الأقل.",
    "auth/network-request-failed":"تعذر الاتصال. تحقق من الإنترنت.",
    generic:"تعذر إنشاء الحساب. حاول مرة أخرى."
  },
  fr:{
    subtitle:"Créez votre compte",emailLabel:"Adresse e-mail",
    passwordLabel:"Mot de passe",confirmLabel:"Confirmer le mot de passe",
    show:"Afficher",hide:"Masquer",signup:"Créer un compte",
    haveAccount:"Vous avez déjà un compte ?",signin:"Se connecter",
    support:"Contacter l'administration",mismatch:"Les mots de passe ne correspondent pas.",
    "auth/email-already-in-use":"Cet e-mail est déjà enregistré. Connectez-vous.",
    "auth/invalid-email":"Saisissez une adresse e-mail valide.",
    "auth/weak-password":"Choisissez un mot de passe plus fort d'au moins 6 caractères.",
    "auth/network-request-failed":"Erreur réseau. Vérifiez votre connexion.",
    generic:"Échec de création du compte. Réessayez."
  }
};

let lang=localStorage.getItem("tube_language")||"en";
if(!translations[lang])lang="en";
const languageSelect=document.getElementById("language");
languageSelect.value=lang;

function t(key){return translations[lang][key]||translations.en[key]||key;}
function applyLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{
    const key=el.dataset.i;
    if(translations[lang][key])el.textContent=translations[lang][key];
  });
  document.getElementById("email").placeholder=
    lang==="ar"?"example@email.com":"you@example.com";
}
languageSelect.addEventListener("change",()=>{
  lang=languageSelect.value;
  localStorage.setItem("tube_language",lang);
  applyLanguage();
});
applyLanguage();

const message=document.getElementById("message");
function showMessage(text,type="error"){
  message.textContent=text;
  message.className="message "+type;
}
function clearMessage(){
  message.textContent="";
  message.className="message";
}

function togglePassword(inputId,buttonId){
  const input=document.getElementById(inputId);
  const visible=input.type==="password";
  input.type=visible?"text":"password";
  document.getElementById(buttonId).textContent=t(visible?"hide":"show");
}
document.getElementById("showPassword").addEventListener("click",()=>{
  togglePassword("password","showPassword");
});
document.getElementById("showConfirm").addEventListener("click",()=>{
  togglePassword("confirmPassword","showConfirm");
});

document.getElementById("signupForm").addEventListener("submit",async event=>{
  event.preventDefault();
  clearMessage();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const confirmPassword=document.getElementById("confirmPassword").value;
  const button=document.getElementById("signupButton");

  if(password!==confirmPassword){
    showMessage(t("mismatch"));
    return;
  }

  button.disabled=true;
  try{
    await setPersistence(auth,browserLocalPersistence);
    await createUserWithEmailAndPassword(auth,email,password);
    window.location.replace("index.html");
  }catch(error){
    showMessage(t(error.code)||t("generic"));
  }finally{
    button.disabled=false;
  }
});
</script></body>
</html>
