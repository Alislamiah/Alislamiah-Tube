<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>البروفايل - Alislamiah Tube</title>
<link rel="icon" href="icon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Tahoma,sans-serif;background:#07111f;color:#fff;min-height:100vh;padding-bottom:85px}
.header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0a1728;border-bottom:1px solid #18304b}
.header img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.header h1{font-size:1.2rem;color:#6fb7ff}
.main{max-width:1100px;margin:auto;padding:22px 16px}
.profile-card[hidden],.empty[hidden],.section-title[hidden]{display:none !important}
.profile-card{display:flex;align-items:center;gap:18px;padding:22px;background:#0b1a2c;border:1px solid #173553;border-radius:18px;margin-bottom:28px}
.profile-avatar{width:100px;height:100px;flex:0 0 100px;border-radius:50%;object-fit:cover;border:3px solid #31577e;background:#07111f}
.profile-name{font-size:1.5rem;font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
.profile-description{color:#a9bfd7;line-height:1.7;margin-bottom:6px}
.profile-information{color:#dcecff;line-height:1.7;white-space:pre-wrap}
.section-title{font-size:1.15rem;margin:24px 0 16px}
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.video-card{display:block;min-width:0;overflow:hidden;text-decoration:none;color:#fff;background:#0b1a2c;border:1px solid #173553;border-radius:12px}
.video-thumbnail{aspect-ratio:16/9;background:#000}
.video-thumbnail video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.video-info{padding:13px}
.video-title{font-size:1rem;line-height:1.5;margin-bottom:7px}
.video-meta{font-size:.82rem;color:#8ea8c4}
.empty{padding:22px;text-align:center;color:#9cb2ca;background:#0b1a2c;border:1px solid #173553;border-radius:12px;line-height:1.8}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:10px 0;background:#081525;border-top:1px solid #17304a}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#718096;font-size:.78rem;min-width:70px}
.nav-item .icon{font-size:1.35rem}
@media(max-width:600px){.profile-card{align-items:flex-start;padding:16px;gap:13px}.profile-avatar{width:76px;height:76px;flex-basis:76px}.profile-name{font-size:1.2rem}.videos-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><img src="icon.png" alt="Alislamiah"><h1>Alislamiah-Tube</h1></header>
<main class="main">
  <section class="profile-card" id="profile-card" hidden>
    <img class="profile-avatar" id="profile-image" src="Alislamiah.png" alt="صورة البروفايل">
    <div><h2 class="profile-name" id="profile-name"></h2><p class="profile-description" id="profile-description"></p><p class="profile-information" id="profile-information"></p></div>
  </section>
  <h2 class="section-title" id="videos-heading">فيديوهات البروفايل</h2>
  <div class="videos-grid" id="profile-videos"></div>
  <div class="empty" id="profile-empty" hidden>لا يوجد بروفايل بهذا الرابط، أو لا توجد فيديوهات مرتبطة به.</div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>الرئيسية</span></a>
  <a href="search.html" class="nav-item"><span class="icon">🔍</span><span>البحث</span></a>
  <a href="Settings.html" class="nav-item"><span class="icon">⚙️</span><span>الإعدادات</span></a>
</nav>
<script src="profiles.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const requestedName = params.get("name") || "";
  const profiles = window.ALISLAMIAH_PROFILES || [];
  const videos = window.ALISLAMIAH_VIDEOS || [];
  const profile = profiles.find(item => item.name === requestedName && item.url === ("profile.html?name=" + encodeURIComponent(requestedName)));
  const grid = document.getElementById("profile-videos");
  const empty = document.getElementById("profile-empty");
  if (!profile) { empty.hidden = false; document.getElementById("videos-heading").hidden = true; return; }
  document.title = profile.name + " - Alislamiah Tube";
  document.getElementById("profile-card").hidden = false;
  document.getElementById("profile-image").src = profile.image || "Alislamiah.png";
  document.getElementById("profile-image").alt = profile.name;
  document.getElementById("profile-name").textContent = profile.name;
  document.getElementById("profile-description").textContent = profile.description || "";
  document.getElementById("profile-information").textContent = profile.information || "";

  /* الانتماء يُحدد بمطابقة رابط البروفايل نفسه، وليس بإنشاء معرف منفصل. */
  const ownedVideos = videos.filter(video => video.profileUrl === profile.url);
  ownedVideos.forEach(video => {
    const card = document.createElement("a");
    card.className = "video-card";
    card.href = "watch.html?v=" + encodeURIComponent(video.file) + "&title=" + encodeURIComponent(video.title);
    const thumb = document.createElement("div");
    thumb.className = "video-thumbnail";
    const preview = document.createElement("video");
    preview.src = video.file; preview.preload = "metadata"; preview.muted = true; preview.playsInline = true;
    thumb.appendChild(preview);
    const info = document.createElement("div"); info.className = "video-info";
    const title = document.createElement("h3"); title.className = "video-title"; title.textContent = video.title;
    const meta = document.createElement("div"); meta.className = "video-meta"; meta.textContent = profile.name;
    info.append(title, meta); card.append(thumb, info); grid.appendChild(card);
  });
  if (!ownedVideos.length) empty.hidden = false;
})();
</script>
</body>
</html>
