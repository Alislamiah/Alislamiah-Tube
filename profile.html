<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>البروفايل - Alislamiah Tube</title>
<link rel="icon" href="icon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Tahoma,sans-serif;background:#07111f;color:#fff;min-height:100vh;padding-bottom:85px}
.header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0a1728;border-bottom:1px solid #18304b}
.header img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.header h1{font-size:1.2rem;color:#6fb7ff}
.main{max-width:1100px;margin:auto;padding:22px 16px}
.profile-card[hidden],.empty[hidden],.section-title[hidden]{display:none !important}
.profile-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 18px;background:transparent;border:0;border-radius:0;margin-bottom:24px}
.profile-avatar{width:104px;height:104px;flex:0 0 104px;border-radius:50%;object-fit:cover;border:2px solid #31577e;background:#07111f}
.profile-name{font-size:1.45rem;font-weight:700;margin:0 0 6px;overflow-wrap:anywhere;color:#f5f9ff}
.profile-description{color:#a9bfd7;line-height:1.7;margin:0 0 4px;max-width:720px}
.profile-information{color:#dcecff;line-height:1.7;white-space:pre-wrap;max-width:720px}
.section-title{font-size:1.3rem;margin:20px 0;color:#fff;font-weight:700}
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.video-card{display:block;min-width:0;overflow:hidden;text-decoration:none;color:#fff;background:#0b1a2c;border:1px solid #173553;border-radius:12px}
.video-card:hover{border-color:#285b89}
.video-thumbnail{width:100%;aspect-ratio:16/9;background:#000}
.video-thumbnail video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.video-info{padding:14px}
.video-title{font-size:1rem;font-weight:600;line-height:1.4;margin-bottom:6px;color:#f5f9ff}
.video-meta{font-size:.85rem;color:#718ba6}
.empty{padding:22px;text-align:center;color:#9cb2ca;background:#0b1a2c;border:1px solid #173553;border-radius:12px;line-height:1.8}
@media(max-width:600px){.videos-grid{grid-template-columns:1fr}.profile-avatar{width:92px;height:92px;flex-basis:92px}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:10px 0;background:#081525;border-top:1px solid #17304a}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#718096;font-size:.78rem;min-width:70px}
.nav-item .icon{font-size:1.35rem}
@media(max-width:600px){.profile-card{align-items:flex-start;padding:16px;gap:13px}.profile-avatar{width:76px;height:76px;flex-basis:76px}.profile-name{font-size:1.2rem}.videos-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><img src="icon.png" alt="Alislamiah"><h1>Alislamiah-Tube</h1></header>
<main class="main">
  <section class="profile-card" id="profile-card" hidden>
    <img class="profile-avatar" id="profile-image" src="Alislamiah.png" alt="صورة البروفايل">
    <div><h2 class="profile-name" id="profile-name"></h2><p class="profile-description" id="profile-description"></p><p class="profile-information" id="profile-information"></p></div>
  </section>
  <h2 class="section-title" id="videos-heading">فيديوهات البروفايل</h2>
  <div class="videos-grid" id="profile-videos"></div>
  <div class="empty" id="profile-empty" hidden>لا يوجد بروفايل بهذا الرابط، أو لا توجد فيديوهات مرتبطة به.</div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>الرئيسية</span></a>
  <a href="search.html" class="nav-item"><span class="icon">🔍</span><span>البحث</span></a>
  <a href="Settings.html" class="nav-item"><span class="icon">⚙️</span><span>الإعدادات</span></a>
</nav>
<script src="profile.js"></script>


<script>
(function () {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const requestedName = (params.get("name") || "").trim();
  const normalize = value => String(value || "").trim().toLowerCase();

  const card = document.getElementById("profile-card");
  const grid = document.getElementById("profile-videos");
  const empty = document.getElementById("profile-empty");
  const heading = document.getElementById("videos-heading");

  function showError(message) {
    empty.hidden = false;
    heading.hidden = true;
    empty.textContent = message;
  }

  // اكتشاف ما إذا كان profiles.js قد حُمّل بالفعل.
  if (!Array.isArray(window.ALISLAMIAH_PROFILES)) {
    showError("لم يتم تحميل profiles.js أو أن الملف لا يعرّف ALISLAMIAH_PROFILES. تحقق من اسم الملف ومكانه.");
    return;
  }

  const profiles = window.ALISLAMIAH_PROFILES;
  const allVideos = Array.isArray(window.ALISLAMIAH_VIDEOS)
    ? window.ALISLAMIAH_VIDEOS
    : [];

  if (!requestedName) {
    showError("الرابط يجب أن يحتوي على ?name=Alislamiah");
    return;
  }

  function urlName(value) {
    try {
      return new URL(value, window.location.href).searchParams.get("name") || "";
    } catch (e) {
      return "";
    }
  }

  const profile = profiles.find(item =>
    normalize(item.name) === normalize(requestedName) ||
    normalize(urlName(item.url)) === normalize(requestedName)
  );

  if (!profile) {
    showError('لم يتم العثور على بروفايل باسم "' + requestedName + '".');
    return;
  }

  // عرض بيانات البروفايل دون تغيير التصميم.
  document.title = profile.name + " - Alislamiah Tube";
  card.hidden = false;
  heading.hidden = false;

  const image = document.getElementById("profile-image");
  image.src = profile.image || "icon.png";
  image.alt = profile.name;
  image.onerror = function () {
    this.onerror = null;
    this.src = "icon.png";
  };

  document.getElementById("profile-name").textContent = profile.name || "";
  document.getElementById("profile-description").textContent =
    profile.description || "";
  document.getElementById("profile-information").textContent =
    profile.information || "";

  // الربط بواسطة profileUrl كما هو موجود في profiles.js.
  const ownedVideos = allVideos.filter(video => {
    if (!video || !video.profileUrl) return false;

    const linkedName = urlName(video.profileUrl);

    if (linkedName) {
      return normalize(linkedName) === normalize(profile.name);
    }

    return normalize(video.profileName) === normalize(profile.name);
  });

  grid.replaceChildren();

  ownedVideos.forEach(video => {
    if (!video.file) return;

    const link = document.createElement("a");
    link.className = "video-card";

    const query = new URLSearchParams({
      v: video.file,
      title: video.title || video.file
    });

    link.href = "watch.html?" + query.toString();

    const thumbnail = document.createElement("div");
    thumbnail.className = "video-thumbnail";

    const preview = document.createElement("video");
    preview.src = video.file;
    preview.preload = "metadata";
    preview.muted = true;
    preview.playsInline = true;

    thumbnail.appendChild(preview);

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = video.title || video.file;

    const meta = document.createElement("div");
    meta.className = "video-meta";
    meta.textContent = video.profileName || profile.name;

    info.append(title, meta);
    link.append(thumbnail, info);
    grid.appendChild(link);
  });

  if (!grid.children.length) {
    showError(
      'تم العثور على البروفايل "' + profile.name +
      '"، لكن لم توجد فيديوهات مرتبطة به.'
    );
  } else {
    empty.hidden = true;
  }
})();
</script>

</body>
</html>
