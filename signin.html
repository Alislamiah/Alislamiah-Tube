<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Sign in — Alislamiah Tube</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
:root{--bg:#07111f;--panel:#0e1b2d;--border:#20344c;--blue:#3979f6;--text:#f4f7ff;--muted:#9aabc2}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#142b49 0%,#07111f 58%);font-family:Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.container{width:100%;max-width:420px}
.language{display:flex;justify-content:flex-end;margin-bottom:14px}
select{background:#101e31;color:white;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
.card{background:rgba(14,27,45,.96);border:1px solid var(--border);border-radius:23px;padding:30px 25px;box-shadow:0 22px 70px #0005}
.brand{text-align:center;margin-bottom:27px}
.brand img{width:76px;height:76px;object-fit:contain;border-radius:18px}
.brand h1{font-size:25px;margin:14px 0 7px}
.brand p{font-size:14px;color:var(--muted);margin:0}
label{display:block;font-size:13px;color:#dce6f5;margin:18px 0 8px}
input{width:100%;padding:14px 13px;background:#081321;border:1px solid var(--border);border-radius:11px;color:white;font-size:15px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3979f622}
.password-wrap{position:relative}
.password-wrap input{padding-inline-end:66px}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#9db9ee;cursor:pointer}
[dir="rtl"] .show{right:auto;left:10px}
.forgot{text-align:right;margin-top:11px}
[dir="rtl"] .forgot{text-align:left}
a{color:#83adff;text-decoration:none;font-size:13px}
a:hover{text-decoration:underline}
button.primary{width:100%;border:0;border-radius:11px;padding:14px;background:linear-gradient(100deg,#3979f6,#2458d7);color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:22px}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;padding:11px;border-radius:10px;margin-top:14px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.message.error{display:block;background:#4a1d29;color:#ffc5ce}
.message.success{display:block;background:#123c31;color:#b8f7d9}
.divider{display:flex;align-items:center;gap:12px;color:#73859d;font-size:12px;margin:23px 0}
.divider:before,.divider:after{content:"";height:1px;background:var(--border);flex:1}
.bottom{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
.support{text-align:center;margin-top:21px}
.support a{display:inline-block;padding:10px 14px;border:1px solid var(--border);border-radius:10px}
.footer{text-align:center;color:#657993;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <div class="language">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
    </select>
  </div>  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="Alislamiah Tube" onerror="this.style.display='none'">
      <h1>Alislamiah Tube</h1>
      <p data-i="subtitle">Sign in to your account</p>
    </div><form id="signinForm">
  <label for="email" data-i="emailLabel">Email address</label>
  <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

  <label for="password" data-i="passwordLabel">Password</label>
  <div class="password-wrap">
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="button" class="show" id="showPassword" data-i="show">Show</button>
  </div>

  <div class="forgot">
    <a href="#" id="forgotLink" data-i="forgot">Forgot password?</a>
  </div>

  <button class="primary" id="signinButton" type="submit" data-i="signin">Sign in</button>
  <div id="message" class="message" role="status"></div>
</form>

<div class="divider" data-i="or">OR</div>

<div class="bottom">
  <span data-i="noAccount">Don't have an account?</span>
  <a href="signup.html" data-i="signup">Sign up</a>
</div>

<div class="support">
  <a href="https://wa.me/213777543015" target="_blank" rel="noopener noreferrer" data-i="support">Contact administration</a>
</div>

  </main>
  <div class="footer">© Alislamiah Tube</div>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6Xn8I6pGBQjEuaFflKCxmQezpHP9D9D9Kk",
  authDomain: "alislamiah-tube.firebaseapp.com",
  projectId: "alislamiah-tube",
  storageBucket: "alislamiah-tube.firebasestorage.app",
  messagingSenderId: "63719640725",
  appId: "1:63719640725:web:62b71660a6c9da8d55959c",
  measurementId: "G-Q9B70NKKCJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const translations = {
  en:{
    subtitle:"Sign in to your account",emailLabel:"Email address",
    passwordLabel:"Password",show:"Show",hide:"Hide",
    forgot:"Forgot password?",signin:"Sign in",or:"OR",
    noAccount:"Don't have an account?",signup:"Sign up",
    support:"Contact administration",required:"Enter your email address first.",
    resetSent:"If an account exists for this email, a password reset email will be sent.",
    invalidEmail:"Enter a valid email address.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/user-not-found":"Incorrect email or password.",
    "auth/wrong-password":"Incorrect email or password.",
    "auth/too-many-requests":"Too many attempts. Please try again later.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    generic:"Sign-in failed. Please try again."
  },
  ar:{
    subtitle:"سجّل الدخول إلى حسابك",emailLabel:"البريد الإلكتروني",
    passwordLabel:"كلمة المرور",show:"إظهار",hide:"إخفاء",
    forgot:"هل نسيت كلمة المرور؟",signin:"تسجيل الدخول",or:"أو",
    noAccount:"ليس لديك حساب؟",signup:"إنشاء حساب",
    support:"تواصل مع الإدارة",required:"أدخل بريدك الإلكتروني أولًا.",
    resetSent:"إذا كان البريد مرتبطًا بحساب، فستصلك رسالة لاستعادة كلمة المرور.",
    invalidEmail:"أدخل بريدًا إلكترونيًا صحيحًا.",
    "auth/invalid-credential":"البريد الإلكتروني أو كلمة المرور غير صحيحة.",
    "auth/user-not-found":"البريد الإلكتروني أو كلمة المرور غير صحيحة.",
    "auth/wrong-password":"البريد الإلكتروني أو كلمة المرور غير صحيحة.",
    "auth/too-many-requests":"محاولات كثيرة. حاول لاحقًا.",
    "auth/network-request-failed":"تعذر الاتصال. تحقق من الإنترنت.",
    generic:"تعذر تسجيل الدخول. حاول مرة أخرى."
  },
  fr:{
    subtitle:"Connectez-vous à votre compte",emailLabel:"Adresse e-mail",
    passwordLabel:"Mot de passe",show:"Afficher",hide:"Masquer",
    forgot:"Mot de passe oublié ?",signin:"Se connecter",or:"OU",
    noAccount:"Vous n'avez pas de compte ?",signup:"Créer un compte",
    support:"Contacter l'administration",required:"Saisissez d'abord votre e-mail.",
    resetSent:"Si un compte existe pour cet e-mail, un message de réinitialisation sera envoyé.",
    invalidEmail:"Saisissez une adresse e-mail valide.",
    "auth/invalid-credential":"E-mail ou mot de passe incorrect.",
    "auth/user-not-found":"E-mail ou mot de passe incorrect.",
    "auth/wrong-password":"E-mail ou mot de passe incorrect.",
    "auth/too-many-requests":"Trop de tentatives. Réessayez plus tard.",
    "auth/network-request-failed":"Erreur réseau. Vérifiez votre connexion.",
    generic:"Échec de connexion. Réessayez."
  }
};

let lang = localStorage.getItem("tube_language") || "en";
if(!translations[lang]) lang="en";
const languageSelect = document.getElementById("language");
languageSelect.value = lang;

function t(key){return translations[lang][key] || translations.en[key] || key;}

function applyLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{
    const key=el.dataset.i;
    if(translations[lang][key]) el.textContent=translations[lang][key];
  });
  document.getElementById("email").placeholder =
    lang==="ar" ? "example@email.com" : "you@example.com";
}
languageSelect.addEventListener("change",()=>{
  lang=languageSelect.value;
  localStorage.setItem("tube_language",lang);
  applyLanguage();
});
applyLanguage();

const message=document.getElementById("message");
function showMessage(text,type="error"){
  message.textContent=text;
  message.className="message "+type;
}
function clearMessage(){
  message.textContent="";
  message.className="message";
}

document.getElementById("showPassword").addEventListener("click",()=>{
  const input=document.getElementById("password");
  const visible=input.type==="password";
  input.type=visible?"text":"password";
  document.getElementById("showPassword").textContent=t(visible?"hide":"show");
});

document.getElementById("signinForm").addEventListener("submit",async event=>{
  event.preventDefault();
  clearMessage();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const button=document.getElementById("signinButton");

  button.disabled=true;
  try{
    await setPersistence(auth,browserLocalPersistence);
    await signInWithEmailAndPassword(auth,email,password);
    showMessage(lang==="ar"?"تم تسجيل الدخول بنجاح.":"", "success");
    window.location.replace("index.html");
  }catch(error){
    showMessage(t(error.code)||t("generic"));
  }finally{
    button.disabled=false;
  }
});

document.getElementById("forgotLink").addEventListener("click",async event=>{
  event.preventDefault();
  clearMessage();

  const email=document.getElementById("email").value.trim();
  if(!email){
    showMessage(t("required"));
    document.getElementById("email").focus();
    return;
  }

  try{
    await sendPasswordResetEmail(auth,email);
    showMessage(t("resetSent"),"success");
  }catch(error){
    if(error.code==="auth/invalid-email"){
      showMessage(t("invalidEmail"));
    }else{
      showMessage(t(error.code)||t("generic"));
    }
  }
});
</script></body>
</html>
