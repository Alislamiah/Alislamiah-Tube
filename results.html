<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج البحث - Alislamiah-Tube</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial, Tahoma, sans-serif; background: #07111f; color: #fff; min-height: 100vh; padding-bottom: 90px; }
    .header { background: #0a1728; padding: 12px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #18304b; display: flex; align-items: center; gap: 12px; }
    .app-icon { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
    .header h1 { font-size: 1.35rem; font-weight: 700; color: #6fb7ff; }
    .main-content { padding: 24px 16px 30px; max-width: 1200px; margin: 0 auto; }
    .section-title { font-size: 1.2rem; margin-bottom: 20px; color: #ffffff; font-weight: 700; }
    .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .video-card { background: #0b1a2c; border: 1px solid #173553; border-radius: 12px; overflow: hidden; text-decoration: none; color: #fff; display: block; box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
    .video-thumbnail { width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-thumbnail video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .video-info { padding: 14px; }
    .video-title { font-size: 1rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: #f5f9ff; }
    .video-meta { font-size: 0.85rem; color: #718ba6; }
    .no-results { text-align: center; padding: 80px 20px; color: #718ba6; font-size: 1.15rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #081525; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #17304a; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #718096; font-size: 0.78rem; gap: 4px; min-width: 70px; }
    .nav-item.active { color: #62b4ff; }
    .nav-item .icon { font-size: 1.35rem; }
  </style>
</head>
<body>
  <header class="header">
    <img src="icon.png" class="app-icon" alt="Alislamiah">
    <h1 id="header-title">Alislamiah-Tube</h1>
  </header>

  <main class="main-content">
    <h2 class="section-title" id="resultsTitle">نتائج البحث</h2>
    <div class="videos-grid" id="resultsContainer"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span>
      <span id="nav-home">الرئيسية</span>
    </a>
    <a href="search.html" class="nav-item active">
      <span class="icon">🔍</span>
      <span id="nav-search">البحث</span>
    </a>
    <a href="Settings.html" class="nav-item">
      <span class="icon">⚙️</span>
      <span id="nav-settings">الإعدادات</span>
    </a>
  </nav>

  <script>
    const translations = {
      ar: { dir: "rtl", header: "Alislamiah-Tube", noQuery: "اكتب كلمة بحث أولاً من صفحة البحث", queryTitle: "نتائج البحث عن: ", noResults: "لا توجد نتائج", home: "الرئيسية", search: "البحث", settings: "الإعدادات" },
      fr: { dir: "ltr", header: "Alislamiah-Tube", noQuery: "Écrivez d'abord un mot de recherche", queryTitle: "Résultats pour: ", noResults: "Aucun résultat trouvé", home: "Accueil", search: "Recherche", settings: "Paramètres" },
      en: { dir: "ltr", header: "Alislamiah-Tube", noQuery: "Type a search word first", queryTitle: "Search results for: ", noResults: "No results found", home: "Home", search: "Search", settings: "Settings" }
    };

    let currentLang = localStorage.getItem("app_lang") || "ar";

    // قاعدة البيانات المحدثة لتطابق الملفات المرفوعة الفعلية 8/8 والـ id التسلسلي الصحيح ✅
    const videos = [
      {id:1, file:"IMG_20260814_164242_861.mp4", title:"ما تيسر من سورة إبراهيم"},
      {id:2, file:"lv_0_20260824111719.mp4", title:"آيات من سورة مريم بصوت مشاري راشد العفاسي"},
      {id:3, file:"IMG_20260812_142700_033.mp4", title:"بل الساعة موعدهم والساعة أدهى وأمر تلاوة عطرة بصوت الشيخ مشاري العفاسي"},
      {id:4, file:"فرض الفصل الثالث سنة ثالثة متوسط في العلوم الفيزيائية (1).mp4", title:"فرض الفصل الثالث سنة ثالثة متوسط في العلوم الفيزيائية (1)"},
      {id:5, file:"فرض الفصل الثالث سنة ثالثة متوسط في العلوم الفيزيائية.mp4", title:"فرض الفصل الثالث سنة ثالثة متوسط في العلوم الفيزيائية"},
      {id:6, file:"فرض الفصل الثالث في ماده العلوم الفيزيائيه السنه اولى متوسط.mp4", title:"فرض الفصل الثالث في مادة العلوم الفيزيائية السنة الأولى متوسط"},
      {id:7, file:"نموذج مقترح فرض الفصل الثالث سنة ثالثة متوسط.mp4", title:"نموذج مقترح فرض الفصل الثالث سنة ثالثة متوسط"},
      {id:8, file:"شرح درس الخطاب المباشر والغير مباشر مكتوب.mp4", title:"شرح درس الخطاب المباشر والغير مباشر مكتوب"},
{id: 9, file: "شرح درس Despite and in spite of.mp4", title: "شرح درس Despite and in spite of"},
{id: 10, file: "شرح درس Linking words.mp4", title: "شرح درس Linking words"}

    ];

    const params = new URLSearchParams(window.location.search);
    const query = (params.get('q') || '').trim().toLowerCase();
    const container = document.getElementById('resultsContainer');
    const titleEl = document.getElementById('resultsTitle');

    function applyLanguage(lang) {
      if (!translations[lang]) lang = "ar";
      const t = translations[lang];

      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("dir", t.dir);

      document.getElementById("header-title").textContent = t.header;
      document.getElementById("nav-home").textContent = t.home;
      document.getElementById("nav-search").textContent = t.search;
      document.getElementById("nav-settings").textContent = t.settings;

      if (query === '') {
        titleEl.textContent = t.queryTitle.replace(': ', '');
        container.innerHTML = `<div class="no-results">${t.noQuery}</div>`;
      } else {
        titleEl.textContent = t.queryTitle + '"' + query + '"';
        const keywords = query.split(/\s+/).filter(k => k.length > 0);
        const filtered = videos.filter(function(v) {
          const title = v.title.toLowerCase();
          return keywords.every(function(kw) { return title.includes(kw); });
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="no-results">${t.noResults}</div>`;
        } else {
          let html = '';
          filtered.forEach(function(v) {
            html += '<a href="watch.html?v=' + v.file + '&title=' + encodeURIComponent(v.title) + '" class="video-card">' +
                      '<div class="video-thumbnail">' +
                        '<video preload="metadata" muted autoplay loop playsinline>' +
                          '<source src="' + v.file + '" type="video/mp4">' +
                        '</video>' +
                      '</div>' +
                      '<div class="video-info">' +
                        '<div class="video-title">' + v.title + '</div>' +
                        '<div class="video-meta">Alislamiah-Tube</div>' +
                      '</div>' +
                    '</a>';
          });
          container.innerHTML = html;
        }
      }
    }

    applyLanguage(currentLang);
  </script>
</body>
</html>
